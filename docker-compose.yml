# ================================================================
# AERISK — Docker Compose (Development)
# ================================================================
#
# Architecture:
#   aerisk-ui     (5173) → /api proxy → aerisk-backend (8000)
#   aerisk-report (5174) → /api proxy → aerisk-backend (8000)
#                                          ├── aerisk-lab  (volume mount)
#                                          └── aerisk-engine (volume mount)
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up                  # subsequent runs
#   docker compose down                # stop & remove containers
#
# The aerisk-engine service is exposed on port 8001 for optional
# standalone testing; the backend uses it via Python import (not HTTP).
# ================================================================

services:

  # ------------------------------------------------------------------
  # AERISK DATABASE  (PostgreSQL 16)
  # Baza de date tranzacțională: users, assessments, results, audit
  # ------------------------------------------------------------------
  aerisk-db:
    image: postgres:16-alpine
    container_name: aerisk-db
    environment:
      POSTGRES_DB: aerisk
      POSTGRES_USER: aerisk
      POSTGRES_PASSWORD: aerisk_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - aerisk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerisk -d aerisk"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # AERISK BACKEND  (port 8000)
  # Imports aerisk-lab and aerisk-engine directly via Python sys.path.
  # Both repos are mounted as read-only volumes.
  # ------------------------------------------------------------------
  aerisk-backend:
    build:
      context: ./aerisk-backend/aerisk-backend
      dockerfile: Dockerfile
    container_name: aerisk-backend
    ports:
      - "8000:8000"
    volumes:
      # Live-reload backend source in dev
      - ./aerisk-backend/aerisk-backend/app:/app/app
      # Inject LAB and ENGINE as Python packages
      - ./aerisk-lab/aerisk-lab:/deps/aerisk-lab:ro
      - ./aerisk-engine:/deps/aerisk-engine:ro
      # Persist audit logs across restarts
      - aerisk-audit-logs:/app/audit_logs
    environment:
      AERISK_LAB_PATH: /deps/aerisk-lab
      AERISK_ENGINE_PATH: /deps/aerisk-engine
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://aerisk:aerisk_dev_2026@aerisk-db:5432/aerisk
    depends_on:
      aerisk-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # AERISK UI  (port 5173)
  # Vite dev server — proxies /api calls to aerisk-backend:8000.
  # ------------------------------------------------------------------
  aerisk-ui:
    build:
      context: ./aerisk-ui
      dockerfile: Dockerfile
    container_name: aerisk-ui
    ports:
      - "5173:5173"
    volumes:
      # Live-reload source (excludes node_modules)
      - ./aerisk-ui/src:/app/src
      - ./aerisk-ui/public:/app/public
      - ./aerisk-ui/index.html:/app/index.html
      - ./aerisk-ui/vite.config.ts:/app/vite.config.ts
    environment:
      # Overrides the hardcoded 127.0.0.1:8000 proxy target in vite.config.ts
      VITE_API_TARGET: http://aerisk-backend:8000
    depends_on:
      aerisk-backend:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # AERISK REPORT  (port 5174)
  # Vite dev server — Raport PRO profesional 8 pagini.
  # Proxiază /api calls la aerisk-backend:8000.
  # ------------------------------------------------------------------
  aerisk-report:
    build:
      context: ./aerisk-report
      dockerfile: Dockerfile
    container_name: aerisk-report
    ports:
      - "5174:5174"
    volumes:
      # Live-reload source (excludes node_modules)
      - ./aerisk-report/src:/app/src
      - ./aerisk-report/public:/app/public
      - ./aerisk-report/index.html:/app/index.html
      - ./aerisk-report/vite.config.ts:/app/vite.config.ts
    environment:
      # Proxy target: backend în rețeaua Docker internă
      VITE_API_TARGET: http://aerisk-backend:8000
    depends_on:
      aerisk-backend:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # AERISK ENGINE  (port 8001 — standalone only, optional)
  # The backend imports the engine directly; this service exists for
  # standalone testing / debugging only.
  # ------------------------------------------------------------------
  aerisk-engine:
    build:
      context: ./aerisk-engine
      dockerfile: Dockerfile
    container_name: aerisk-engine
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles:
      # Only starts when explicitly requested:
      #   docker compose --profile engine up
      - engine

volumes:
  aerisk-audit-logs:
    driver: local
  aerisk-db-data:
    driver: local
